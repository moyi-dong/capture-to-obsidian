version: 1
skill: "capture-to-obsidian"
description: "Human-readable setup, routing, safety, and note-format cases."

cases:
  - name: "first setup asks in user language"
    input: "把这个对话设置成自动记录随记"
    context: "No Obsidian vault or capture path can be found."
    expected:
      - "Ask in Chinese for an existing path or offer the default path."
      - "Do not claim setup is complete before receiving the answer."

  - name: "default setup"
    input: "用默认位置"
    context: "The skill previously offered the platform default."
    expected:
      - "Create or validate the default capture directory."
      - "Merge the delimited capture rules into the project AGENTS.md."
      - "Confirm in Chinese that links, IDs, or dictated messages can now be dropped into the conversation."

  - name: "short dictated note"
    input: "我觉得这个功能要轻量一点 不要搞太多依赖以后维护起来麻烦"
    context: "Automatic capture is configured."
    expected:
      - "Create one Markdown note with timestamp, summary, and lightly punctuated original content."
      - "Return only the created file link."

  - name: "built-in speech-fix rule"
    input: "记一下 这个skill先做册式 没问题再长传"
    context: "Automatic capture is configured; the separate speech-fix skill may or may not be installed."
    expected:
      - "Infer from context that 册式 means 测试 and 长传 means 上传."
      - "Use only high-confidence repairs while preserving the user's intended order and viewpoint."
      - "Produce the same corrected note semantics whether using the embedded rule or the installed speech-fix skill."

  - name: "speech-fix keeps ambiguous technical terms"
    input: "记一下 这个sql先做册式 没问题再长传 ID 019fcfb6-8bcf-7750-bd09-cf9a29482baa保持原样"
    context: "There is no prior context proving whether sql means SQL or Skill."
    expected:
      - "Repair the high-confidence 册式 and 长传 transcription errors."
      - "Do not rewrite sql to Skill without stronger context."
      - "Preserve the ID exactly."

  - name: "explicit no-capture"
    input: "先不要把这段记录进去，帮我看看规则有没有问题。"
    context: "Automatic capture is configured."
    expected:
      - "Do not create a note."
      - "Perform or answer the requested review task."

  - name: "direct document inside Obsidian vault"
    input: "太长了，把上面的战略规划缩短，在开头加一个总结，然后写到 /Users/example/Documents/Obsidian Vault/战略规划/长期规划.md"
    context: "The previous assistant message is a generated strategic plan; the exact target file is empty."
    expected:
      - "Classify this as a direct document task rather than Capture intent."
      - "Write the shortened plan to the exact requested filename."
      - "Do not add a capture timestamp, Source field, preserved-original section, or numbered filename suffix."

  - name: "exact path is not silently renamed"
    input: "把这段随记保存为 /Users/example/Documents/Obsidian Vault/旅行.md"
    context: "The user explicitly wants a capture note, but the exact file already contains meaningful content and no overwrite or append operation was specified."
    expected:
      - "Keep Capture intent because the user explicitly requested a note."
      - "Ask whether to replace, edit, or append before changing the existing file."
      - "Do not silently create 旅行 2.md."

  - name: "direct document and separate capture"
    input: "把上面的规划写到 /tmp/plan.md，并另外把我的目标记录成一篇随记。"
    context: "Automatic capture is configured."
    expected:
      - "Write the plan using the direct document workflow and the exact path."
      - "Create a separate capture note for the user's goal."
      - "Apply capture formatting only to the separate note."

  - name: "codex task ID"
    input: "019fcfb6-8bcf-7750-bd09-cf9a29482baa"
    context: "A Codex read-thread capability is available."
    expected:
      - "Read the task instead of treating the UUID as note prose."
      - "Capture user messages in chronological order and exclude assistant replies."
      - "Leave no protocol schemas, logs, or helper files in the capture project or notes folder."

  - name: "unreadable resource ID"
    input: "abc-unknown-984728347234"
    context: "No available tool recognizes the identifier."
    expected:
      - "Ask one concise clarification in the user's language."
      - "Do not create a meaningless note."

  - name: "web link"
    input: "https://example.com/article"
    context: "The page is readable."
    expected:
      - "Summarize the page and preserve its exact URL and title."
      - "Do not copy long third-party text."

  - name: "filename collision"
    input: "继续记录同一个主题"
    context: "The inferred title already exists."
    expected:
      - "Create a numbered filename without overwriting the existing note."

  - name: "capture and another task"
    input: "把这个想法记录下来，然后帮我列出下一步。"
    context: "Automatic capture is configured."
    expected:
      - "Create the note and also answer the requested task."
      - "Do not apply the link-only response rule when another result was explicitly requested."

  - name: "exact-token protection"
    input: "记一下：把 ID 019fcfb6-8bcf-7750-bd09-cf9a29482baa 和金额 15,000 保持原样。"
    context: "Automatic capture is configured."
    expected:
      - "Preserve the ID and amount exactly."
